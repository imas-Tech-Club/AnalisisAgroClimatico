[project]
name = "predictor-rinde"
version = "0.1.0"
description = "Predictor de rinde de soja y maíz por departamento en años Niño (Club de Informática UADE)"
readme = "README.md"
authors = [
    { name = "jsampieri", email = "juanchi.sampieri@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=9.2.0",
]
