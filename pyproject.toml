[project]
name = "predictor-rinde"
version = "0.1.0"
description = "Predictor de rinde de soja y maíz por departamento en años Niño (Club de Informática UADE)"
readme = "README.md"
authors = [
    { name = "jsampieri", email = "juanchi.sampieri@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "earthengine-api>=1.7.51",
    "geopandas>=1.2.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "planetary-computer>=1.0.0",
    "pyarrow>=26.0.1",
    "pyproj>=3.8.0",
    "pystac-client>=0.9.1",
    "rasterio>=1.5.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "shapely>=2.2.0",
    "xgboost>=3.4.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=9.2.0",
]
